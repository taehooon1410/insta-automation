name: Render Card News & Upload to Instagram

on:
  repository_dispatch:
    types: [trigger_render_upload]

jobs:
  render-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Render Slides & Upload to Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          CLIENT_PAYLOAD: ${{ json(github.event.client_payload) }}
        run: |
          python scripts/render_upload.py
